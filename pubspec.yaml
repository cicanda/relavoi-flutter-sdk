name: relavoi_flutter
description: Relavoi SDK for Flutter - Privacy-preserving call and SMS masking for Nigerian businesses.
version: 0.2.0
homepage: https://relavoi.com
repository: https://github.com/cicanda/relavoi-flutter-sdk
documentation: https://docs.relavoi.com

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  url_launcher: ^6.2.0
  firebase_messaging: ^15.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  plugin:
    platforms:
      android:
        package: com.relavoi.flutter_sdk
        pluginClass: RelavoiFlutterPlugin
      ios:
        pluginClass: RelavoiFlutterPlugin
