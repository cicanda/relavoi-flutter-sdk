name: CI

on:
  push:
    branches: [main, develop]
    # Release tags run the full suite too, and gate on the version check below.
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  package:
    # This repo had no CI at all until 2 November 2026, while publishing a
    # tagged v0.3.1 that integrators install from a git ref. Nothing checked
    # that the package analysed, that its tests passed, or that it was a valid
    # package at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The floor in pubspec.yaml is Flutter 3.10, and `stable` is well
          # past it. Pinning an exact version here would hide the thing this
          # job is for: whether the package still builds on what an integrator
          # actually has installed.
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # flutter_lints via analysis_options.yaml. Any issue fails the build;
        # the package is clean today, so there is nothing to grandfather.
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate the package
        # The publish path is parked until the first integration customer, so
        # this never uploads anything. It is here because a package can be
        # unpublishable for reasons nothing else catches: a missing license, a
        # description outside the length pub.dev wants, a dependency with no
        # version bound. Catching that now is cheaper than finding it on the
        # day we decide to publish.
        run: flutter pub publish --dry-run

      - name: README dart samples analyze
        # Every ```dart fence in the README is analyzed against this working
        # tree, in a generated package that depends on it by path. A sample an
        # integrator could not compile fails the build.
        #
        # The fence annotations are what make this possible: a reference
        # listing and a two-line snippet cannot be analyzed the same way as a
        # whole file. They are documented in scripts/doc-samples/README.md.
        #
        # The docs site's Flutter pages hold most of the samples and are not in
        # this repository. relavoi-docs runs this same script over them on a
        # schedule, with this package checked out at its released tag, because
        # that is the version a reader of the docs is using.
        run: python3 scripts/check-doc-samples.py README.md

  release-version:
    # Only on a tag. Fails the release unless pubspec, the podspec, the README
    # install ref and the newest CHANGELOG section all name the tag being cut,
    # and unless the iOS floor reads the same in all three places that state it.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: The tree agrees with the tag
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME}"
